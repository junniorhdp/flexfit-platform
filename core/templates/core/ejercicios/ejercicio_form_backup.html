{% extends 'core/base.html' %}
{% block content %}

<div class="page-header">
  <div>
    <h2>{{ accion }} ejercicio</h2>

    {% if accion == 'Crear' %}
      <p>Complete los datos del ejercicio</p>
    {% else %}
      <p>Modifica los datos del ejercicio</p>
    {% endif %}
  </div>
</div>

<div class="card" style="max-width:720px">
  <form method="POST">
    {% csrf_token %}

    <!-- NOMBRE + TIPO -->
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control"
               value="{{ ej.nombre }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Tipo ejercicio</label>
        
         <select name="tipo_ejercicio" class="form-control">
  <option value="">-- Seleccionar --</option>
  {% for t in tipos %}
    <option value="{{ t.id_tipo }}"
      {% if ej.tipo_ejercicio and ej.tipo_ejercicio.id_tipo == t.id_tipo %}selected{% endif %}>
      {{ t.nombre }}
    </option>
  {% endfor %}
</select>

      </div>
    </div>


    <!-- EQUIPO + DIFICULTAD -->
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Equipo necesario</label>
        <input type="text" name="equipo_necesario" class="form-control"
               value="{{ ej.equipo_necesario }}">
      </div>

      <div class="form-group">
        <label class="form-label">Nivel dificultad</label>
        <select name="nivel_dificultad" class="form-control">
          <option value="Bajo" {% if ej.nivel_dificultad == 'Bajo' %}selected{% endif %}>Bajo</option>
          <option value="Medio" {% if ej.nivel_dificultad == 'Medio' %}selected{% endif %}>Medio</option>
          <option value="Alto" {% if ej.nivel_dificultad == 'Alto' %}selected{% endif %}>Alto</option>
        </select>
      </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div class="form-group">
      <label class="form-label">Instrucciones</label>
      <textarea name="instrucciones" class="form-control">{{ ej.instrucciones }}</textarea>
    </div>

    <!-- VIDEOS -->
<div class="form-group">
  <label class="form-label">Videos de YouTube</label>

  <div class="video-group">
    <input type="text" name="url_video_1" class="form-control"
           placeholder="Video 1"
           value="{{ urls.0 }}">

    <input type="text" name="url_video_2" class="form-control"
           placeholder="Video 2"
           value="{{ urls.1 }}">

    <input type="text" name="url_video_3" class="form-control"
           placeholder="Video 3"
           value="{{ urls.2 }}">
  </div>
</div>

    <!-- BOTONES -->
    <div style="display:flex; gap:12px; margin-top:10px;">
      <button type="submit" class="btn btn-primary">
        Guardar cambios
      </button>

      <a href="{% url 'coach_ejercicios' %}" class="btn btn-outline">
        Cancelar
      </a>
    </div>

  </form>
</div>

{% endblock %}
