{% extends 'core/base.html' %}

{% block title %}Agregar Rutina{% endblock %}
{% block topbar_title %}Agregar Rutina{% endblock %}

{% block content %}

<div class="card">

    <h2>{{ rutina.nombre }}</h2>

    <p>
        {{ rutina.descripcion }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Fecha de inicio</label>
            <input
                type="date"
                name="fecha_inicio"
                class="form-control"
                required
            >
        </div>

        <div class="form-group">
            <label>Fecha final</label>
            <input
                type="date"
                name="fecha_final"
                class="form-control"
            >
        </div>

        <div class="form-group">

            <label>Días de entrenamiento</label>

            <div style="display:grid;gap:10px;margin-top:10px">

                <label>
                    <input type="checkbox" name="dias" value="Lunes">
                    Lunes
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Martes">
                    Martes
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Miércoles">
                    Miércoles
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Jueves">
                    Jueves
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Viernes">
                    Viernes
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Sábado">
                    Sábado
                </label>

                <label>
                    <input type="checkbox" name="dias" value="Domingo">
                    Domingo
                </label>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Guardar rutina
        </button>

    </form>

</div>

{% endblock %}
